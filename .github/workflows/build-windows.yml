name: Build Windows VST3

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: R2R-MUSIC-VST3-Windows-x64
          path: build/R2RMusicCompressor_artefacts/Release/VST3/
